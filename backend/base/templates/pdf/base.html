<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% block title %}
        Reporte
      {% endblock %}
    </title>
  </head>
  <body>
    {% if include_header %}
      <div class="header">
        <div class="header-left">
          {% if logo_base64 %}
            <img src="{{ logo_base64 }}" alt="Logo" />
          {% endif %}
        </div>
        <div class="header-right">
          <h1>{{ opciones.nombre_empresa|default:'365 Viajes' }}</h1>
          {% if opciones.telefonos %}
            <p>Tel: {{ opciones.telefonos }}</p>
          {% endif %}
        </div>
      </div>
      <hr />
    {% endif %} {% block content %}
    {% endblock %}
  </body>
</html>
